name: flutter_kit
description: A reusable Flutter project template with Feature-first Clean Architecture + Riverpod.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  cached_network_image: ^3.4.1

  # State Management + DI (all-in-one)
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^4.0.0

  # Router
  go_router: ^14.8.1

  # Network
  dio: ^5.8.0+1
  pretty_dio_logger: ^1.4.0

  # Models / Code Generation
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: ^2.4.15
  freezed: ^3.0.0
  json_serializable: ^6.9.4
  riverpod_generator: ^4.0.0
  riverpod_lint: ^3.0.0
  custom_lint: ^0.8.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
