name: flutter_kit
description: >-
  Base framework for FPT B2B Flutter apps — app shell, Dio stack, storage,
  error contract, Result/pagination, theme system and shared widgets.
  Feature-first Clean Architecture + Riverpod. Consumed as a library; apps
  define their own environment, routes, features and auth rules.
version: 0.1.0
publish_to: "none"

environment:
  sdk: ^3.7.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

  # UI
  cached_network_image: ^3.4.1

  # State management + DI (Riverpod IS the DI container — no get_it)
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^4.0.0

  # Network
  dio: ^5.8.0+1
  pretty_dio_logger: ^1.4.0

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting (the preset in lib/analysis_options.yaml is what apps include)
  custom_lint: ^0.8.1
  flutter_lints: ^5.0.0
  riverpod_lint: ^3.0.0

  # Code generation
  build_runner: ^2.4.15
  riverpod_generator: ^4.0.0

flutter:
  uses-material-design: true
