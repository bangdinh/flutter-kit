name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.41.x"

jobs:
  kit:
    name: Kit — analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build
      # `dart analyze` (not `flutter analyze`) — same command the Makefile uses.
      - run: dart analyze lib test
      - run: dart format --set-exit-if-changed lib test
      - run: flutter test --coverage

      - uses: actions/upload-artifact@v4
        with:
          name: kit-coverage
          path: coverage/lcov.info
          if-no-files-found: warn

  example:
    name: Example app — analyze + test
    needs: kit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # The app consumes the kit via a path dependency, so this run also proves
      # the kit's public API still builds for a consumer.
      - name: Seed example env files
        working-directory: example
        run: |
          for e in dev staging prod; do
            [ -f ".env.$e" ] || echo "API_BASE_URL=https://api.example.com" > ".env.$e"
          done

      - working-directory: example
        run: flutter pub get
      - working-directory: example
        run: dart run build_runner build
      - working-directory: example
        run: dart analyze lib test
      - working-directory: example
        run: flutter test

  build-android:
    name: Example — build APK
    needs: example
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Seed example env files
        working-directory: example
        run: |
          for e in dev staging prod; do
            [ -f ".env.$e" ] || echo "API_BASE_URL=https://api.example.com" > ".env.$e"
          done

      - working-directory: example
        run: flutter pub get
      - working-directory: example
        run: dart run build_runner build
      - working-directory: example
        run: flutter build apk --debug
