name: CI

# Only PRs targeting master, so day-to-day commits on a feature branch don't
# spam the pipeline. Need a run on a branch before opening the PR? Actions →
# CI → "Run workflow" (workflow_dispatch below) and pick the branch.
on:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.41.x"

jobs:
  kit:
    name: Kit — analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build

      # Generated code is committed, so regenerating must be a no-op. A diff
      # here means someone changed an annotation without running `make gen`.
      - name: Generated code is up to date
        run: |
          git diff --exit-code -- lib || {
            echo "::error::kit generated code is stale — run 'make gen' and commit the result."
            exit 1
          }

      # `dart analyze` (not `flutter analyze`) — same command the Makefile uses.
      - run: dart analyze lib test
      - run: dart format --set-exit-if-changed lib test
      - run: flutter test --coverage

      - uses: actions/upload-artifact@v4
        with:
          name: kit-coverage
          path: coverage/lcov.info
          if-no-files-found: warn

  example:
    name: Example app — analyze + test
    needs: kit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # The app consumes the kit via a path dependency, so this run also proves
      # the kit's public API still builds for a consumer.
      - name: Seed example env files
        working-directory: example
        run: |
          for e in dev staging prod; do
            [ -f ".env.$e" ] || echo "API_BASE_URL=https://api.example.com" > ".env.$e"
          done

      - working-directory: example
        run: flutter pub get
      - working-directory: example
        run: dart run build_runner build

      # env.g.dart is deliberately untracked (it embeds .env contents), so it
      # never shows up here; everything else must already be committed.
      - name: Generated code is up to date
        working-directory: example
        run: |
          git diff --exit-code -- lib || {
            echo "::error::example generated code is stale — run 'make gen-example' and commit it."
            exit 1
          }

      - working-directory: example
        run: dart analyze lib test
      - working-directory: example
        run: flutter test

  # Runs on PRs to master and on a manual dispatch — the merge gate, not every
  # commit. It is the only job that catches an Android-side break (manifest,
  # gradle, a plugin's minSdk).
  build-android:
    name: Example — build APK
    needs: example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Seed example env files
        working-directory: example
        run: |
          for e in dev staging prod; do
            [ -f ".env.$e" ] || echo "API_BASE_URL=https://api.example.com" > ".env.$e"
          done

      - working-directory: example
        run: flutter pub get
      - working-directory: example
        run: dart run build_runner build
      - working-directory: example
        run: flutter build apk --debug
