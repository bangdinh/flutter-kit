# Matches what `flutter create` generates today. The old 1536M was not enough
# to transform Flutter's engine jars and OOM'd the CI APK build.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Jetifier is OFF deliberately. It rewrites android.support.* → androidx.* in
# EVERY dependency jar, including the multi-hundred-MB Flutter engine jars
# (armeabi_v7a_debug.jar, x86_64_debug.jar) — which is what ran the CI build out
# of heap. Nothing here needs it: `./gradlew checkJetifier` reports no project
# uses legacy support libraries. Re-run that check before ever turning it back on.
android.enableJetifier=false
